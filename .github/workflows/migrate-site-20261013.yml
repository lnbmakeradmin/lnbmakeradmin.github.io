name: One-time independent website migration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-site-20261013.yml']

permissions:
  contents: read

concurrency:
  group: independent-site-migration-20261013
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'lnbmakeradmin/lnbmakeradmin.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out destination
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Copy verified website files and preserve destination advertising identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlsplit

          root = pathlib.Path.cwd()
          source = 'https://raw.githubusercontent.com/lnbmaker/lnbmaker.github.io/91de07a4c4cab67468a9da2b1871ae0fa5e5958f/'
          files = {
              'index.html': '12c5b737e600c56a84597b5e2fbd5bf3495fbdf9',
              'en.html': '3d8924b8d115612d8259fd0e07fe58c0857910f8',
              'style.css': 'ddcc5e9f1b8b3d22d25eb7b91ac386ae54296492',
              'script.js': 'f235fddd8eb4a69dc0f3d6734c1735f9e40017a7',
              'legal.css': '8a249bb33d8c7d0412a299e2781f890c9ecec4c7',
              'privacy-ko.html': '4e78243ef0b4f33f50234fecfb724c31d611ed0e',
              'privacy.html': '7a5e5298b86e9500330c8940b30b013493242a5c',
              'terms-ko.html': '2c9fa99b9783b25fbe1cb88bd517a8d91d1848ee',
              'terms.html': '168e94cebdcf8a712b691b6a0f29cc1ae47585c1',
              'assets/brand-world.webp': '467c81dcd80f21a3045913b67df37a16c21701bc',
          }
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          expected_index = '0e8c8928ec2f278df1bad3377347bba125e120db'
          if blob_sha((root / 'index.html').read_bytes()) != expected_index:
              raise RuntimeError('Destination homepage changed; stopping to avoid overwriting newer work.')
          protected = {p: (root / p).read_bytes() for p in ['README.md', 'app-ads.txt']}
          if blob_sha(protected['app-ads.txt']) != '9ce69ac376a80886065b21c8a416c1297689492b':
              raise RuntimeError('Advertising file changed; stopping for review.')

          downloaded = {}
          for path, expected in files.items():
              request = urllib.request.Request(source + path, headers={'User-Agent': 'LnB-maker-site-migration'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
              if blob_sha(data) != expected:
                  raise RuntimeError('Source content hash mismatch: ' + path)
              downloaded[path] = data
          for path, data in downloaded.items():
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          class LocalLinks(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key not in ('href', 'src') or not value:
                          continue
                      parsed = urlsplit(value)
                      if parsed.scheme or parsed.netloc or not parsed.path:
                          continue
                      relative = unquote(parsed.path)
                      candidate = (root / relative.lstrip('/')) if relative.startswith('/') else (root / self.page).parent / relative
                      candidate = candidate.resolve()
                      candidate.relative_to(root)
                      if candidate.is_dir():
                          candidate = candidate / 'index.html'
                      if not candidate.is_file():
                          raise RuntimeError('Missing local link: ' + self.page + ' -> ' + value)

          for path in files:
              if path.endswith(('.html', '.css', '.js')):
                  text = (root / path).read_text(encoding='utf-8')
                  if 'lnbmaker.github.io' in text:
                      raise RuntimeError('Old website dependency remains: ' + path)
                  if path.endswith('.html'):
                      LocalLinks(path).feed(text)
          for path, before in protected.items():
              if (root / path).read_bytes() != before:
                  raise RuntimeError('Protected destination file modified: ' + path)

          subprocess.run(['git', 'add', '--', *files], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              raise RuntimeError('No migration changes found.')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Migrate all LnB website pages and assets locally; preserve app-ads.txt'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print('MIGRATION_COMMIT=' + commit)
          print('Verified 10 copied site files, all local page links, and no old-domain dependencies.')
          print('Destination README.md and app-ads.txt preserved byte-for-byte.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Independent website migration\n\n')
              summary.write('Copied 10 verified site files to this repository.\n\n')
              summary.write('All local HTML links resolve; old-domain dependencies removed.\n\n')
              summary.write('Existing destination README.md and app-ads.txt preserved.\n\n')
              summary.write('Commit: `' + commit + '`\n')
          PY
  verify-published-site:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify new public site after Pages deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import time
          import urllib.request

          base = 'https://lnbmakeradmin.github.io/'
          expected = {
              '': '12c5b737e600c56a84597b5e2fbd5bf3495fbdf9',
              'index.html': '12c5b737e600c56a84597b5e2fbd5bf3495fbdf9',
              'en.html': '3d8924b8d115612d8259fd0e07fe58c0857910f8',
              'style.css': 'ddcc5e9f1b8b3d22d25eb7b91ac386ae54296492',
              'script.js': 'f235fddd8eb4a69dc0f3d6734c1735f9e40017a7',
              'legal.css': '8a249bb33d8c7d0412a299e2781f890c9ecec4c7',
              'privacy-ko.html': '4e78243ef0b4f33f50234fecfb724c31d611ed0e',
              'privacy.html': '7a5e5298b86e9500330c8940b30b013493242a5c',
              'terms-ko.html': '2c9fa99b9783b25fbe1cb88bd517a8d91d1848ee',
              'terms.html': '168e94cebdcf8a712b691b6a0f29cc1ae47585c1',
              'assets/brand-world.webp': '467c81dcd80f21a3045913b67df37a16c21701bc',
              'app-ads.txt': '9ce69ac376a80886065b21c8a416c1297689492b',
          }
          deadline = time.monotonic() + 480
          pending = dict(expected)
          while pending and time.monotonic() < deadline:
              for path, wanted in list(pending.items()):
                  try:
                      request = urllib.request.Request(base + path + '?migration_check=' + str(int(time.time())), headers={'Cache-Control': 'no-cache', 'User-Agent': 'LnB-maker-site-verification'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          data = response.read()
                          status = response.status
                      actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                      if status == 200 and actual == wanted:
                          print('LIVE_OK ' + base + path + ' [HTTP 200, exact content hash]')
                          del pending[path]
                  except Exception as exc:
                      print('Waiting for ' + (path or '/') + ': ' + type(exc).__name__)
              if pending:
                  print('Pending public deployment: ' + ', '.join(pending))
                  time.sleep(15)
          if pending:
              raise RuntimeError('Public verification timed out: ' + ', '.join(pending))
          print('SUCCESS: All 12 public URLs match expected migrated content. Existing app-ads.txt is preserved.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Public website verification\n\nAll 12 public URLs returned HTTP 200 with the expected content hashes.\n\n')
              summary.write('Includes Korean/English homepages, legal pages, CSS, JavaScript, image, and preserved app-ads.txt.\n')
          PY
